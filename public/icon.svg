<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Target Ring / Pulse Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="720 180" filter="url(#glow)" opacity="0.85" />
  
  <!-- Flame / Streak Core -->
  <path d="M 256 120 C 270 170 310 195 310 240 C 310 270 286 295 256 295 C 226 295 202 270 202 240 C 202 210 230 175 256 120 Z" fill="url(#flameGrad)" />

  <!-- Dynamic Checkmark & Dumbbell fusion -->
  <path d="M 180 340 L 235 395 L 340 290" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Small spark dots -->
  <circle cx="340" cy="180" r="10" fill="#38bdf8" />
  <circle cx="170" cy="220" r="8" fill="#fbbf24" />
</svg>
